version: '3.8'

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: taxease-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: taxease-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: taxease-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: taxease-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - service-registry

  grafana:
    image: grafana/grafana:latest
    container_name: taxease-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ─── Service Registry ─────────────────────────────────────────────────────

  service-registry:
    build: ./service-registry
    container_name: taxease-service-registry
    ports:
      - "8760:8760"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8760/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Config Server ────────────────────────────────────────────────────────

  config-server:
    build: ./config-server
    container_name: taxease-config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_URL: http://service-registry:8760/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── API Gateway ──────────────────────────────────────────────────────────

  api-gateway:
    build: ./api-gateway
    container_name: taxease-api-gateway
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://service-registry:8760/eureka/
    depends_on:
      service-registry:
        condition: service_healthy

  # ─── Microservices ────────────────────────────────────────────────────────

  identity-service:
    build: ./identity-service
    container_name: taxease-identity-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://service-registry:8760/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  taxpayer-service:
    build: ./taxpayer-service
    container_name: taxease-taxpayer-service
    ports:
      - "8088:8088"
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://service-registry:8760/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  tax-filing-service:
    build: ./tax-filing-service
    container_name: taxease-tax-filing-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://service-registry:8760/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    container_name: taxease-payment-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://service-registry:8760/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  audit-service:
    build: ./audit-service
    container_name: taxease-audit-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://service-registry:8760/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: taxease-notification-service
    ports:
      - "8086:8086"
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://service-registry:8760/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  report-service:
    build: ./report-service
    container_name: taxease-report-service
    ports:
      - "8087:8087"
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://service-registry:8760/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy

volumes:
  mysql_data:
  grafana_data:
