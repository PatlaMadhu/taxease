server.port=8081
spring.application.name=api-gateway

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8760/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

# JWT secret (must match identity-service)
jwt.secret=${JWT_SECRET:mySuperSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong123456789}

# ─── ROUTES ────────────────────────────────────────────────────────────────────

# 1. Identity Service - Auth
spring.cloud.gateway.routes[0].id=identity-service
spring.cloud.gateway.routes[0].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/audit-logs/**

# 2. Taxpayer Service
spring.cloud.gateway.routes[1].id=taxpayer-service
spring.cloud.gateway.routes[1].uri=lb://TAXPAYER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/taxpayers/**

# 3. Tax Filing Service
spring.cloud.gateway.routes[2].id=tax-filing-service
spring.cloud.gateway.routes[2].uri=lb://TAX-FILING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/filings/**,/api/documents/**

# 4. Payment Service
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**

# 5. Audit Service
spring.cloud.gateway.routes[4].id=audit-service
spring.cloud.gateway.routes[4].uri=lb://AUDIT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/audits/**

# 6. Notification Service
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notifications/**

# 7. Report Service
spring.cloud.gateway.routes[6].id=report-service
spring.cloud.gateway.routes[6].uri=lb://REPORT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/reports/**

# 8. Compliance Service
spring.cloud.gateway.routes[7].id=compliance-service
spring.cloud.gateway.routes[7].uri=lb://COMPLIANCE-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/compliance/**

# ─── CORS ──────────────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# ─── ACTUATOR ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=gateway,health,info
management.endpoint.health.show-details=always

# ─── LOGGING ───────────────────────────────────────────────────────────────────
logging.level.com.apigateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
