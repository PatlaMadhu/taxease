server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      routes:
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/auth/**,/api/audit-logs/**

        - id: taxpayer-service
          uri: lb://TAXPAYER-SERVICE
          predicates:
            - Path=/api/taxpayers/**

        - id: tax-filing-service
          uri: lb://TAX-FILING-SERVICE
          predicates:
            - Path=/api/filings/**,/api/documents/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**

        - id: audit-service
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/api/audits/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

        - id: report-service
          uri: lb://REPORT-SERVICE
          predicates:
            - Path=/api/reports/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8760/eureka/}

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong123456789}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
