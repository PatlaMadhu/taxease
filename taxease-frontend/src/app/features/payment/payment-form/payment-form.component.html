<div class="page-container">
  <div class="page-header">
    <div style="display:flex;align-items:center;gap:8px">
      <button mat-icon-button routerLink="/payment"><mat-icon>arrow_back</mat-icon></button>
      <div>
        <h2>Make Payment</h2>
        <p class="subtitle">Filing ID: #{{ filingId }}</p>
      </div>
    </div>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Amount (₹)</mat-label>
          <input matInput formControlName="amount" type="number" min="0.01">
          <span matTextPrefix>₹&nbsp;</span>
          <mat-error *ngIf="form.get('amount')?.hasError('required')">Amount is required</mat-error>
          <mat-error *ngIf="form.get('amount')?.hasError('min')">Amount must be greater than 0</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Payment Method</mat-label>
          <mat-select formControlName="method">
            <mat-option *ngFor="let m of methods" [value]="m">{{ m }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('method')?.hasError('required')">Payment method is required</mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-stroked-button type="button" routerLink="/payment">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
            <span *ngIf="!loading">Pay Now</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
