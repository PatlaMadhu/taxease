<div class="page-container">
  <div class="page-header">
    <div style="display:flex;align-items:center;gap:8px">
      <button mat-icon-button routerLink="/audit"><mat-icon>arrow_back</mat-icon></button>
      <div>
        <h2>Create Audit Case</h2>
        <p class="subtitle">Initiate a new audit investigation</p>
      </div>
    </div>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Officer ID</mat-label>
          <input matInput formControlName="officerId" type="number">
          <mat-error *ngIf="form.get('officerId')?.hasError('required')">Officer ID is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Taxpayer ID (optional)</mat-label>
          <input matInput formControlName="taxpayerId" type="number">
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Audit Scope</mat-label>
          <textarea matInput formControlName="scope" rows="3" placeholder="Describe the scope of this audit…"></textarea>
          <mat-error *ngIf="form.get('scope')?.hasError('required')">Scope is required</mat-error>
        </mat-form-field>
        <div class="form-actions">
          <button mat-stroked-button type="button" routerLink="/audit">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
            <span *ngIf="!loading">Create Audit</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
