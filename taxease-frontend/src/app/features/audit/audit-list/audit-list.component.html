<div class="page-container">
  <div class="page-header">
    <div>
      <h2>Audit Cases</h2>
      <p class="subtitle">Manage and track all audit investigations</p>
    </div>
    <button mat-raised-button color="primary" routerLink="new" *ngIf="canCreate">
      <mat-icon>add</mat-icon> New Audit
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div class="table-toolbar">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Search audits…</mat-label>
          <input matInput (keyup)="applyFilter($event)">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div>

      <div *ngIf="loading" class="spinner-center"><mat-spinner diameter="40"></mat-spinner></div>

      <table mat-table [dataSource]="dataSource" matSort *ngIf="!loading" class="full-table">
        <ng-container matColumnDef="auditId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Audit ID</th>
          <td mat-cell *matCellDef="let a">#{{ a.auditId }}</td>
        </ng-container>
        <ng-container matColumnDef="officerId">
          <th mat-header-cell *matHeaderCellDef>Officer ID</th>
          <td mat-cell *matCellDef="let a">{{ a.officerId }}</td>
        </ng-container>
        <ng-container matColumnDef="taxpayerId">
          <th mat-header-cell *matHeaderCellDef>Taxpayer ID</th>
          <td mat-cell *matCellDef="let a">{{ a.taxpayerId || '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="scope">
          <th mat-header-cell *matHeaderCellDef>Scope</th>
          <td mat-cell *matCellDef="let a">{{ a.scope }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let a">
            <span class="status-badge" [ngClass]="'status-' + a.status.toLowerCase()">{{ a.status }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
          <td mat-cell *matCellDef="let a">{{ a.createdAt | date:'mediumDate' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let a">
            <ng-container *ngIf="auth.hasRole('OFFICER', 'ADMINISTRATOR', 'MANAGER')">
              <button mat-icon-button [matMenuTriggerFor]="statusMenu" [matMenuTriggerData]="{audit: a}" matTooltip="Update Status">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="closeAudit(a)" [disabled]="a.status === 'CLOSED'" matTooltip="Close Audit">
                <mat-icon>lock</mat-icon>
              </button>
            </ng-container>
            <span *ngIf="!auth.hasRole('OFFICER', 'ADMINISTRATOR', 'MANAGER')" class="read-only-label">View Only</span>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell empty-msg" [attr.colspan]="displayedColumns.length">No audits found.</td>
        </tr>
      </table>

      <mat-menu #statusMenu="matMenu">
        <ng-template matMenuContent let-audit="audit">
          <button mat-menu-item *ngFor="let s of statuses" (click)="updateStatus(audit, s)">{{ s }}</button>
        </ng-template>
      </mat-menu>

      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
