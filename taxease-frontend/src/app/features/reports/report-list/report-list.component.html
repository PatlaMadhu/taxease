<div class="page-container" *ngIf="!loading; else spinner">
  <div class="page-header">
    <div>
      <h2>Reports &amp; Analytics</h2>
      <p class="subtitle">System-wide insights and data exports</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button mat-stroked-button (click)="downloadCustom()"><mat-icon>download</mat-icon> Download CSV</button>
      <button mat-raised-button color="primary" routerLink="new"><mat-icon>add</mat-icon> Generate Report</button>
    </div>
  </div>

  <div class="cards-grid">
    <app-dashboard-card label="Total Transactions"  [value]="metrics?.totalTransactions || 0"                    icon="receipt_long"           color="blue"></app-dashboard-card>
    <app-dashboard-card label="Successful Txns"     [value]="metrics?.successfulTransactions || 0"               icon="check_circle"           color="green"></app-dashboard-card>
    <app-dashboard-card label="Total Revenue (₹)"   [value]="(revenue?.totalRevenue || 0) | number:'1.2-2'"      icon="account_balance_wallet" color="purple"></app-dashboard-card>
    <app-dashboard-card label="Total Audits"        [value]="auditDash?.totalAudits || 0"                        icon="gavel"                  color="orange"></app-dashboard-card>
  </div>

  <div class="charts-grid" style="margin-bottom:24px">
    <mat-card>
      <mat-card-header><mat-card-title>Transaction Metrics</mat-card-title></mat-card-header>
      <mat-card-content>
        <canvas baseChart [data]="barChartData" [options]="barChartOptions" type="bar"></canvas>
      </mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-header><mat-card-title>Revenue Trend</mat-card-title></mat-card-header>
      <mat-card-content>
        <canvas baseChart [data]="lineChartData" type="line" [options]="{ responsive: true }"></canvas>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-card>
    <mat-card-header><mat-card-title>Generated Reports</mat-card-title></mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="reports" class="full-table">
        <ng-container matColumnDef="reportId">
          <th mat-header-cell *matHeaderCellDef>Report ID</th>
          <td mat-cell *matCellDef="let r">#{{ r.reportId }}</td>
        </ng-container>
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let r">{{ r.title }}</td>
        </ng-container>
        <ng-container matColumnDef="scope">
          <th mat-header-cell *matHeaderCellDef>Scope</th>
          <td mat-cell *matCellDef="let r">{{ r.scope }}</td>
        </ng-container>
        <ng-container matColumnDef="generatedAt">
          <th mat-header-cell *matHeaderCellDef>Generated</th>
          <td mat-cell *matCellDef="let r">{{ r.generatedDate | date:'medium' }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="['reportId','title','scope','generatedAt']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['reportId','title','scope','generatedAt']"></tr>
      </table>
      <p *ngIf="reports.length === 0" class="empty-msg" style="padding:24px 0;text-align:center;color:var(--text-muted)">No reports generated yet.</p>
    </mat-card-content>
  </mat-card>
</div>

<ng-template #spinner>
  <div class="spinner-center"><mat-spinner></mat-spinner></div>
</ng-template>
