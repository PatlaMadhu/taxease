<div class="page-container">
  <div class="page-header">
    <div style="display:flex;align-items:center;gap:8px">
      <button mat-icon-button routerLink="/tax-filing"><mat-icon>arrow_back</mat-icon></button>
      <div>
        <h2>New Tax Filing</h2>
        <p class="subtitle">Submit your tax declaration for the period</p>
      </div>
    </div>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tax Period (e.g. 2024-Q1, FY2024)</mat-label>
          <input matInput formControlName="period" placeholder="2024-Q1">
          <mat-icon matSuffix>calendar_today</mat-icon>
          <mat-error *ngIf="form.get('period')?.hasError('required')">Period is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Amount Declared (₹)</mat-label>
          <input matInput formControlName="amountDeclared" type="number" min="0">
          <span matTextPrefix>₹&nbsp;</span>
          <mat-error *ngIf="form.get('amountDeclared')?.hasError('required')">Amount is required</mat-error>
          <mat-error *ngIf="form.get('amountDeclared')?.hasError('min')">Amount must be 0 or greater</mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-stroked-button type="button" routerLink="/tax-filing">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
            <span *ngIf="!loading">Submit Filing</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
