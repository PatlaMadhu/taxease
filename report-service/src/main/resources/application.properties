server.port=8087
spring.application.name=report-service

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8760/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/taxease_report_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sravani@12345}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway — disabled locally (ddl-auto=update handles schema), enable in prod with DDL_AUTO=validate
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# Feign + Resilience4j
spring.cloud.openfeign.circuitbreaker.enabled=true
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000
resilience4j.circuitbreaker.instances.AUDIT-SERVICE.slidingWindowSize=10
resilience4j.circuitbreaker.instances.AUDIT-SERVICE.failureRateThreshold=50
resilience4j.circuitbreaker.instances.AUDIT-SERVICE.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.AUDIT-SERVICE.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.slidingWindowSize=10
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.failureRateThreshold=50
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.PAYMENT-SERVICE.permittedNumberOfCallsInHalfOpenState=3

# Jackson
spring.jackson.mapper.accept-case-insensitive-enums=true

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.com.reportservice=INFO
